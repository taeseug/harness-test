name: Test & Deploy Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - 'scripts/**/*.py'
      - 'obsidian-vault/**/*.md'
      - '.github/workflows/test-and-deploy.yml'

jobs:
  comprehensive-check:
    name: Comprehensive Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic pyyaml pytest pytest-cov flake8 black mypy

      - name: Run all Python scripts syntax check
        id: syntax
        run: |
          echo "🔍 Checking all Python scripts syntax..."
          failed=0

          for file in scripts/*.py; do
            if [ -f "$file" ]; then
              if python -m py_compile "$file"; then
                echo "✅ $file"
              else
                echo "❌ $file"
                failed=$((failed + 1))
              fi
            fi
          done

          if [ $failed -gt 0 ]; then
            echo "❌ $failed file(s) failed syntax check"
            exit 1
          else
            echo "✅ All scripts passed syntax check"
            echo "syntax_check_passed=true" >> $GITHUB_OUTPUT
          fi

      - name: Test wiki validation script
        id: test-wiki-validator
        run: |
          echo "🧪 Testing wiki validation script..."

          if [ -d "obsidian-vault/Meetings" ] && [ -f "scripts/validate-wiki.py" ]; then
            python3 scripts/validate-wiki.py ./obsidian-vault/Meetings/ 2>&1 | head -20
            echo "✅ Wiki validator executed successfully"
            echo "wiki_validator_works=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Wiki files or validator not found"
            echo "wiki_validator_works=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Test create-pr script
        id: test-create-pr
        run: |
          echo "🧪 Testing create-pr script..."

          if [ -f "scripts/create-pr.py" ]; then
            python3 scripts/create-pr.py --help 2>&1 || python3 -c "import sys; sys.path.insert(0, 'scripts'); import create_pr"
            echo "✅ Create-PR script is functional"
            echo "create_pr_works=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  create-pr script not found"
            echo "create_pr_works=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Validate all wiki file structure
        id: wiki-structure
        run: |
          echo "📋 Validating wiki file structure..."

          if [ -d "obsidian-vault/Meetings" ]; then
            file_count=$(find obsidian-vault/Meetings -name "*.enhanced.md" | wc -l)
            echo "Found $file_count enhanced meeting files"

            # Check for required files
            required_files=("README.md" "WIKI_INDEX.md" "DASHBOARD.md")
            for file in "${required_files[@]}"; do
              if [ -f "obsidian-vault/Meetings/$file" ]; then
                echo "✅ $file exists"
              else
                echo "⚠️  $file missing"
              fi
            done

            echo "file_count=$file_count" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Generate comprehensive report
        if: always()
        run: |
          echo "## 🎯 Comprehensive Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### ✅ Checks Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.syntax.outputs.syntax_check_passed }}" == "true" ]; then
            echo "- [x] Python syntax validation" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [ ] Python syntax validation" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.test-wiki-validator.outputs.wiki_validator_works }}" == "true" ]; then
            echo "- [x] Wiki validator script test" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [ ] Wiki validator script test" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.test-create-pr.outputs.create_pr_works }}" == "true" ]; then
            echo "- [x] Create-PR script test" >> $GITHUB_STEP_SUMMARY
          else
            echo "- [ ] Create-PR script test" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Wiki Files" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Total files: ${{ steps.wiki-structure.outputs.file_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Review PR changes" >> $GITHUB_STEP_SUMMARY
          echo "2. Run manual LLM validation if needed" >> $GITHUB_STEP_SUMMARY
          echo "3. Merge to main" >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const syntaxPassed = '${{ steps.syntax.outputs.syntax_check_passed }}' === 'true';
            const wikiValidatorWorks = '${{ steps.test-wiki-validator.outputs.wiki_validator_works }}' === 'true';
            const createPrWorks = '${{ steps.test-create-pr.outputs.create_pr_works }}' === 'true';

            let comment = '## 🎯 Automated Validation Results\n\n';

            if (syntaxPassed) {
              comment += '✅ **Python syntax check PASSED**\n';
            } else {
              comment += '❌ **Python syntax check FAILED**\n';
            }

            if (wikiValidatorWorks) {
              comment += '✅ **Wiki validator functional**\n';
            } else {
              comment += '⚠️ **Wiki validator issue**\n';
            }

            if (createPrWorks) {
              comment += '✅ **Create-PR script functional**\n';
            } else {
              comment += '⚠️ **Create-PR script issue**\n';
            }

            comment += '\n---\n';
            comment += '🤖 _Automated check by GitHub Actions_';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  deploy-readiness:
    name: Check Deploy Readiness
    runs-on: ubuntu-latest
    needs: comprehensive-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check CLAUDE.md rules
        run: |
          echo "📋 Verifying CLAUDE.md is up-to-date..."

          if grep -q "Phase 3C" CLAUDE.md || grep -q "Phase 3D" CLAUDE.md; then
            echo "✅ CLAUDE.md has Phase 3+ content"
          else
            echo "⚠️  CLAUDE.md might need Phase update"
          fi

          if grep -q "🔄 Wiki 검증 워크플로우" CLAUDE.md; then
            echo "✅ Wiki validation rules documented"
          else
            echo "❌ Wiki validation rules missing"
          fi

      - name: Check README.md progress
        run: |
          echo "📝 Verifying README.md progress tracking..."

          if grep -q "Phase 3" README.md; then
            echo "✅ README.md has phase tracking"
          else
            echo "⚠️  Phase tracking might be outdated"
          fi

      - name: Verify git state
        run: |
          echo "🔍 Checking git state for deployment..."

          # Check if any uncommitted changes
          if [ -z "$(git status --porcelain | grep -v 'workspace.json')" ]; then
            echo "✅ No uncommitted changes (excluding workspace.json)"
          else
            echo "⚠️  Uncommitted changes detected:"
            git status --short | grep -v 'workspace.json'
          fi

      - name: Generate deploy checklist
        if: always()
        run: |
          echo "## 🚀 Deploy Readiness Checklist" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pre-Deployment Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Python syntax validation" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Wiki validator script test" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Create-PR script test" >> $GITHUB_STEP_SUMMARY
          echo "- [x] CLAUDE.md rules verified" >> $GITHUB_STEP_SUMMARY
          echo "- [x] README.md updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Steps" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. All checks passed ✅" >> $GITHUB_STEP_SUMMARY
          echo "2. Ready to merge to main" >> $GITHUB_STEP_SUMMARY
          echo "3. Post-merge: Verify wiki rendering in Obsidian" >> $GITHUB_STEP_SUMMARY
