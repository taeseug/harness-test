name: Automated PR Creation

on:
  push:
    branches: [release/v1.0.0]
    paths:
      - 'obsidian-vault/Meetings/**/*.md'
      - 'llm-ssot/Meetings/**/*.md'
      - 'scripts/**/*.py'
      - 'docs/**/*'
  workflow_dispatch:
    inputs:
      pr_title:
        description: 'Custom PR title'
        required: false
      pr_body:
        description: 'Custom PR body'
        required: false

jobs:
  check-and-create-pr:
    name: Create PR if changes validated
    runs-on: ubuntu-latest

    outputs:
      pr_created: ${{ steps.create-pr.outputs.pr_created }}
      pr_url: ${{ steps.create-pr.outputs.pr_url }}
      pr_number: ${{ steps.create-pr.outputs.pr_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic pyyaml PyGithub

      - name: Detect changes
        id: detect-changes
        run: |
          echo "🔍 Detecting changes..."

          # Check for new/modified wiki files
          wiki_changes=$(git diff --name-only origin/main...HEAD 2>/dev/null | grep -E "(obsidian-vault|llm-ssot)/Meetings" | wc -l || echo 0)
          script_changes=$(git diff --name-only origin/main...HEAD 2>/dev/null | grep "scripts/" | wc -l || echo 0)
          doc_changes=$(git diff --name-only origin/main...HEAD 2>/dev/null | grep "docs/" | wc -l || echo 0)

          echo "wiki_changes=$wiki_changes" >> $GITHUB_OUTPUT
          echo "script_changes=$script_changes" >> $GITHUB_OUTPUT
          echo "doc_changes=$doc_changes" >> $GITHUB_OUTPUT

          echo "📊 Changes detected:"
          echo "  Wiki files: $wiki_changes"
          echo "  Scripts: $script_changes"
          echo "  Docs: $doc_changes"

      - name: Run wiki validation
        id: wiki-validate
        if: steps.detect-changes.outputs.wiki_changes != '0'
        run: |
          echo "📋 Running wiki validation..."
          python3 scripts/validate-wiki.py ./obsidian-vault/Meetings/
          echo "wiki_validation_passed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Run Python validation
        id: python-validate
        if: steps.detect-changes.outputs.script_changes != '0'
        run: |
          echo "🐍 Running Python validation..."
          find scripts/ -name "*.py" -type f | while read file; do
            python -m py_compile "$file"
            if [ $? -eq 0 ]; then
              echo "✓ $file is valid"
            else
              echo "✗ $file has syntax errors"
              exit 1
            fi
          done
          echo "python_validation_passed=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Prepare PR details
        id: pr-details
        run: |
          # Get the last commit message
          commit_msg=$(git log -1 --pretty=%B)
          commit_hash=$(git log -1 --pretty=%h)

          # Determine PR title and body
          if [ -n "${{ github.event.inputs.pr_title }}" ]; then
            pr_title="${{ github.event.inputs.pr_title }}"
          else
            # Extract from commit message
            pr_title=$(echo "$commit_msg" | head -1)
          fi

          if [ -n "${{ github.event.inputs.pr_body }}" ]; then
            pr_body="${{ github.event.inputs.pr_body }}"
          else
            pr_body=$(cat << EOF
## 📋 자동 생성된 PR

**커밋**: [\`$commit_hash\`](../../commit/$commit_hash)

### 📝 변경사항
$commit_msg

### ✅ 검증 상태
- Wiki validation: ${{ steps.wiki-validate.outputs.wiki_validation_passed || 'skipped' }}
- Python validation: ${{ steps.python-validate.outputs.python_validation_passed || 'skipped' }}

### 🔗 관련 링크
- CLAUDE.md: [프로젝트 규칙 보기](../blob/release/v1.0.0/CLAUDE.md)
- Phase 진행: [진행도 확인](../blob/release/v1.0.0/README.md)

---
**Created by GitHub Actions** on $(date -u +'%Y-%m-%d %H:%M:%S UTC')
EOF
)
          fi

          echo "pr_title=$pr_title" >> $GITHUB_OUTPUT
          echo "pr_body<<EOF" >> $GITHUB_OUTPUT
          echo "$pr_body" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.pr-details.outputs.pr_title }}
          title: ${{ steps.pr-details.outputs.pr_title }}
          body: ${{ steps.pr-details.outputs.pr_body }}
          branch: create-pull-request/patch-${{ github.run_number }}
          base: main
          delete-branch: true
          labels: 'automated,ci'
          assignees: ${{ github.actor }}

      - name: Report PR Status
        if: always()
        run: |
          echo "## 🚀 Automated PR Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.create-pr.outputs.pull-request-number }}" != "" ]; then
            echo "✅ **PR Created Successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- PR #${{ steps.create-pr.outputs.pull-request-number }}" >> $GITHUB_STEP_SUMMARY
            echo "- URL: ${{ steps.create-pr.outputs.pull-request-url }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **No changes detected for PR creation**" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Wiki changes: ${{ steps.detect-changes.outputs.wiki_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "- Script changes: ${{ steps.detect-changes.outputs.script_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "- Doc changes: ${{ steps.detect-changes.outputs.doc_changes }}" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify on PR creation
    runs-on: ubuntu-latest
    needs: check-and-create-pr
    if: needs.check-and-create-pr.outputs.pr_created == 'true'

    steps:
      - name: PR created notification
        run: |
          echo "✅ PR successfully created!"
          echo "PR #${{ needs.check-and-create-pr.outputs.pr_number }}"
          echo "${{ needs.check-and-create-pr.outputs.pr_url }}"
