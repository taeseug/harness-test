name: Python Lint & Type Check

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**/*.py'
      - '.github/workflows/python-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**/*.py'

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 isort pylint

      - name: Check code formatting with black
        run: |
          echo "🎨 Checking code formatting with black..."
          black --check scripts/ --diff || true
        continue-on-error: true

      - name: Check import sorting with isort
        run: |
          echo "📦 Checking import sorting with isort..."
          isort --check-only scripts/ --diff || true
        continue-on-error: true

      - name: Run flake8 linting
        run: |
          echo "🔍 Running flake8 linting..."
          flake8 scripts/ \
            --count \
            --statistics \
            --max-line-length=120 \
            --ignore=E203,W503 || true
        continue-on-error: true

      - name: Run pylint
        run: |
          echo "🔎 Running pylint..."
          find scripts/ -name "*.py" -type f | while read file; do
            echo "Checking $file..."
            pylint "$file" --disable=all --enable=E,F || true
          done
        continue-on-error: true

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install type checker
        run: |
          python -m pip install --upgrade pip
          pip install mypy types-PyYAML

      - name: Run mypy type checking
        run: |
          echo "🔬 Running mypy type checking..."
          mypy scripts/ --ignore-missing-imports || true
        continue-on-error: true

  test:
    name: Test Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic pyyaml pytest

      - name: Check script syntax
        run: |
          echo "✅ Checking Python syntax..."
          find scripts/ -name "*.py" -type f | while read file; do
            python -m py_compile "$file"
            if [ $? -eq 0 ]; then
              echo "✓ $file is valid"
            else
              echo "✗ $file has syntax errors"
              exit 1
            fi
          done

      - name: Verify imports
        run: |
          echo "📦 Verifying imports..."
          python3 -c "import anthropic; print('✓ anthropic')"
          python3 -c "import yaml; print('✓ pyyaml')"

      - name: Generate report
        if: always()
        run: |
          echo "## 🐍 Python Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Validation Date**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checks Performed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Black formatting check" >> $GITHUB_STEP_SUMMARY
          echo "- [x] isort import sorting" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Flake8 linting" >> $GITHUB_STEP_SUMMARY
          echo "- [x] MyPy type checking" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Syntax validation" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Import verification" >> $GITHUB_STEP_SUMMARY
